# Editing screen settings (Pages CMS, app.pagescms.org).
# Charlene and future staff edit photos and text here; saving updates the website.
settings:
  commit:
    identity: user   # history shows who made each edit

media:
  input: src/images
  output: /images
  extensions: [jpg, jpeg, png, webp, gif]

content:
  - name: photos
    label: Photo gallery
    type: file
    path: src/_data/photos.yml
    list: true
    fields:
      - { name: photo, label: Photo, type: image }
      - { name: added, label: Date added (newest show first), type: date }
      - { name: archived, label: "Archive (moves it to 'Older photos')", type: boolean }
      - { name: description, label: "Short description (not shown; helps screen readers)", type: string }

  - name: staff
    label: Staff
    type: file
    path: src/_data/staff.yml
    list: true
    fields:
      - { name: name, label: Name, type: string }
      - { name: role, label: Title, type: string }
      - { name: photo, label: Photo, type: image }
      - { name: bio, label: Bio paragraphs, type: text, list: true }

  - name: home
    label: Home page
    type: file
    path: src/_data/home.yml
    fields:
      - { name: hero_kicker, label: Small line above the headline, type: string }
      - { name: hero_title, label: Headline, type: string }
      - { name: hero_photo, label: Big photo at the top, type: image }
      - { name: intro, label: Intro paragraph, type: text }
      - { name: about, label: About us, type: text }

  - name: involved
    label: Get Involved cards
    type: file
    path: src/_data/involved.yml
    list: true
    fields:
      - { name: title, label: Title, type: string }
      - { name: photo, label: Photo, type: image }
      - { name: text, label: Description, type: text }

  - name: testimonials
    label: Student quotes
    type: file
    path: src/_data/testimonials.yml
    list: true
    fields:
      - { name: name, label: Name, type: string }
      - { name: year, label: Class year, type: string }
      - { name: photo, label: Photo, type: image }
      - { name: quote, label: Quote, type: text }

  - name: alumni
    label: Alumni page
    type: file
    path: src/_data/alumni.yml
    fields:
      - { name: kicker, label: Small line above the headline, type: string }
      - { name: title, label: Headline, type: string }
      - { name: intro, label: Intro, type: text }
      - name: cards
        label: Cards
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: photo, label: Photo, type: image }
          - { name: text, label: Description, type: text }
          - { name: button, label: Button text, type: string }
          - { name: link, label: Button link, type: string }
