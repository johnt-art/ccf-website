# One-time job: copies the site's photos off the old GoHighLevel site into
# src/images so they keep working after GoHighLevel is cancelled.
# Safe to re-run; it only downloads photos that aren't already in the repo.
name: Copy photos from old site
on:
  push:
    paths: [image-sources.json, .github/workflows/copy-photos.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download missing photos
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          src = json.load(open("image-sources.json"))
          for local, url in src.items():
              dest = "src" + local
              if os.path.exists(dest):
                  continue
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=60) as r, open(dest, "wb") as f:
                      f.write(r.read())
                  print("copied", dest, os.path.getsize(dest))
              except Exception as e:
                  print("FAILED", dest, e)
          EOF
      - name: Commit photos
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add src/images
          git diff --cached --quiet || git commit -m "Copy photos from old site into the repo"
          git push
