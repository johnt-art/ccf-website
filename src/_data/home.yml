hero_kicker: Campus Christian Fellowship helps students
hero_title: Know God. Follow God. Love Others.
hero_photo: /images/home-hero.jpeg
intro: >-
  Are you a current or future student at Appalachian State University? Are you
  looking for a community of people who follow Jesus to help you on your
  journey? We are a campus ministry at App State committed to following Jesus
  together and creating a deep understanding of what it means to Love God that
  generates a desire in all to live life to the full. (John 10:10)
about: >-
  At Campus Christian Fellowship we seek to have fun, learn about Jesus, and
  build community. We love to dig into Scripture, wrestle with its meaning in
  context, then walk it out as best we can. We're a fun community that loves to
  meet new people, so come on out and meet us!
