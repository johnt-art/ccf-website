summary: >-
  We seek to follow and obey Jesus as our Savior and Lord, and to make disciples
  along the way.
statements:
  - text: We believe in one God—Father, Son and Holy Spirit.
    refs: Matthew 5:16, 45; 6:1, 4, 8, 9; James 1:17; John 1:1; 14:9; Genesis 1:2; John 4:24; 14:16-20; 2 Peter 1:21
  - text: We believe in God the Father Almighty, Creator of all things visible and invisible.
    refs: Genesis 1:1; Acts 17:24-28; Hebrews 11:3
  - text: We believe in Jesus Christ, God's one and only Son, our one and only Savior.
    refs: John 1:14; 1 John 4:9; John 3:16; 2 Peter 3:18
  - text: We believe He was born both fully human and fully divine, conceived of the Holy Spirit and the virgin Mary, and lived a sinless life.
    refs: Matthew 21:11; John 1:14; John 6:42; Romans 5:15-17; Colossians 2:9; Matthew 1:18; Luke 1:26-38; Hebrews 4:15
  - text: We believe Jesus suffered, was crucified, died and was buried, and then rose again bodily from the dead on the third day.
    refs: Luke 23:1-46; Luke 23:44 - 24:8; John 20:24-29; 1 Corinthians 15:3-8
  - text: We believe He then ascended into Heaven and now sits at the right hand of the Father.
    refs: Luke 22:69; Acts 1:1-9; Colossians 3:1
  - text: We believe He will one day return to earth to judge both the living and the dead.
    refs: Matthew 24:36-42; John 14:1-3; Acts 1:10-11; 10:39-42; 1 Peter 4:5
  - text: We believe in the Holy Spirit, Who is a personal and active part of the triune God, and dwells in every Christian.
    refs: John 16:5-15; Acts 1:7-8; Romans 8:26-27; 1 Corinthians 3:16; 6:19; 2 Timothy 1:14
  - text: We believe in the Bible—God's Holy Word. We believe God inspired the original writings of the Scripture, and therefore the Bible is completely trustworthy in all its parts.
    refs: John 14:26; 16:12-15; Acts 1:16; 1 Corinthians 2:12-13; 2 Timothy 3:14-16; 2 Peter 1:20-21
  - text: We accept the Bible as the final authority for all matters of faith and practice.
    refs: Isaiah 40:8; Matthew 5:17-19; 24:35; Romans 15:4; Hebrews 4:12
  - text: We believe that people created by God sin against Him and are consequently lost and without hope apart from Jesus Christ.
    refs: Acts 4:12; Romans 3:23
  - text: We believe that salvation—the forgiveness of sins—cannot be earned, but is given to us only through the blood of Jesus Christ and by God's grace.
    refs: Matthew 26:28; Romans 5:1-11, 6:23; Ephesians 2:8-10; Hebrews 10:19-22; 1 Peter 1:18-19; 1 John 1:7
  - text: We believe that we must respond to God by admitting our sin and our need for God's grace.
    refs: Romans 3:23; Titus 3:3-7
  - text: "We believe we then must respond in obedience by:"
    refs: ""
    list:
      - Believing and confessing the truth about Jesus. (Matthew 10:32; Romans 10:9, 10)
      - Trusting Jesus as Savior and Lord. (Romans 10:11-13; Philippians 2:11)
      - Turning away from sin and seeking to honor God with our lives. (Acts 3:19, 20:21; Romans 2:7)
      - Being baptized (immersed) into Christ. (Acts 2:38; Acts 8:36-38; Romans 6:1-4)
  - text: We believe in the church of Jesus Christ, consisting of all Christians everywhere.
    refs: Matthew 16:13-18; Acts 2:14-47; Ephesians 1:22, 23
  - text: "We believe in the church's mission: making disciples of all nations, baptizing them and teaching them to obey all of Jesus' commands."
    refs: Matthew 28:18-20
