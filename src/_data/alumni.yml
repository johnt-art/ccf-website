kicker: Alumni, help us be a NETWORK of Committed Followers of Christ who
title: Know God. Follow God. Love Others.
intro: >-
  Our vision here is not to simply serve students during their tenure at App
  State, but to provide a long-lasting community of connection, conversation,
  and foundation. We want to serve and encourage each one of you as you follow
  Christ in whatever context you find yourself. See more of how we strive to do
  that below!
cards:
  - title: Alumni Facebook Group
    photo: /images/alumni-facebook.png
    text: >-
      Join our Alumni Facebook Group to stay up to date on events and what is
      happening with our ministry. It's also a great way to share what you're
      learning with other alumni who may be walking through, or have walked
      through, similar life circumstances.
    button: Find the Facebook group
    link: https://www.facebook.com/groups/265128346846832/
  - title: Alumni Meetup
    photo: /images/alumni-meetup.jpeg
    text: >-
      Want to host an alumni meetup? Chances are, if you're in NC, then you have
      more CCF Alumni near you than you realize. We'd love to help you in the
      scheduling and planning of an event near you. Let's get together and
      encourage each other!
    button: Email us
    link: mailto:asuccf@gmail.com
  - title: Discussion or Coaching Conversations
    photo: /images/staff-troutman.jpeg
    text: >-
      Have a dream you're chewing on? Making a big transition? Struggling to be
      the spouse or parent you want to be? John LOVES to have these
      conversations and help you process your unique situation and make small
      changes for a huge impact!
    button: Schedule a Zoom call
    link: https://cal.com/john-troutman/30min
