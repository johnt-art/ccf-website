quote: >-
  "In a world of shallow distraction, there exists an ocean full of depth and
  peace waiting to be discovered in each one of us."
statement: >-
  The vision of CCF is to create students who Know God, Follow God, Love Others,
  and will one day impact families, transform communities, and cultivate
  goodness through the deep knowledge and intimate practice of loving God with
  all their heart, soul, mind and strength, and to love their neighbor as
  themselves!
how: >-
  We do this by creating transformative conversations and experiences through
  powerful Conversation, intimate Connection, and building Foundation.
pillars:
  - title: Conversation
    verse: Do not conform to the pattern of this world, but be transformed by the renewing of your mind.
    ref: Romans 12:2
    paragraphs:
      - >-
        We are invited into transformation through the gospel of Christ, yet that
        transformation hardly ever happens outside of conversations. At CCF, we
        don't seek to simply have "conversation" that passes along information.
        Instead, we seek to ask powerful questions that lead us into discovering
        God's heart and ourselves. We ask questions centered around Scripture,
        around who we're becoming, around our own identities.
      - >-
        These questions lead us into discovery, where new neuro-pathways are
        created. Then these new thoughts "stick" and transformation happens.
        Questions and conversation are the tools we use to dig deep into
        ourselves, Scripture, and God's heart for the world.
  - title: Connection
    verse: Having purified your souls by your obedience to the truth for a sincere brotherly love, love one another earnestly.
    ref: 1 Peter 1:22
    paragraphs:
      - >-
        What is it that truly lasts beyond the college years? Connections. The
        connections created in college are some of the strongest bonds we
        experience throughout our lives. At CCF, we strive to help facilitate
        those connections so that each student finds a deep community of love
        and encouragement that will last well beyond their college career.
      - >-
        But we don't want to stop at just the student relationships. We strive
        to be the connecting force between the students, our campus, our
        community, and our alumni. We want to bring all together to live out
        Jesus' invitation to dwell in unity as the body of Christ.
  - title: Foundation
    verse: According to the grace of God given to me, like a skilled master builder I laid a foundation, and someone else is building upon it. Let each one take care how he builds upon it.
    ref: 1 Corinthians 3:10
    paragraphs:
      - >-
        The "success" of a campus ministry cannot truly be measured until years
        after graduation. For a short period of time, we are entrusted to invest
        in each student, then send them out. Our goal is that each student will
        be truly committed to following Christ for the long haul as they leave
        our ministry.
      - >-
        So, we focus on building the foundation that they can stand on again and
        again. We give tools and frameworks to help study Scripture, we provide
        coaching and mentoring to help them understand life, we teach and model
        daily and weekly practices that help us connect with God anew and
        afresh. All this so their foundation may stand firm as others build on
        it in the future.
