# The "Get Involved" cards on the home page and the Get Involved page.
- title: Immersion — Wednesday Nights
  photo: /images/immersion.jpeg
  text: >-
    Visit us for our large group meeting every Wednesday night during the
    semester. We meet at 8:30 pm in the Linville Falls Ballroom on the 2nd floor
    of the Student Union. Come join us as we worship and discuss Scripture
    together.
- title: Bible Buddies — Tuesday Afternoon
  photo: /images/bible-buddies.jpeg
  text: >-
    This is the time we really dig into Scripture and wrestle with its meaning
    for us today. If you've ever wondered if there is more underneath the "hood"
    of Scripture but you're not sure where to start, this is where you want to
    be!
- title: C-Groups
  photo: /images/c-groups.jpeg
  text: >-
    These are our small groups designed to build community and learn to live
    life together. We have a girls' C-Group and a guys' C-Group that meet
    throughout the week. If you're interested in getting plugged in, contact us
    below!
- title: Events and Service
  photo: /images/events-service.jpeg
  text: >-
    As a ministry, we love to hang out and to serve together. We do an annual
    Spring Break trip centered around service and have many service
    opportunities throughout the year. We also do plenty of events aimed to
    create a fun and close community. Check out our calendar to see what we have
    coming up!
